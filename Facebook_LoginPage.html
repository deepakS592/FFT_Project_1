<html>
<head>
    <title>Facebook Login Page</title>
    <style>
        body
        {
            background-color: rgb(255, 255, 255);
            text-align: center;
        }
        h1
        {
            color: rgb(24, 119, 242);
            font-family: sans-serif;
            font-size: 50px;
            margin-top: 150px;
            margin-bottom: 10px;
        }
        h2
        {
            color: rgb(0, 0, 0);
            font-family: sans-serif;
            margin-bottom: 10px;
        }
        form
        {
            border: 1px solid rgb(220, 220, 220);
            width: 350px;
            margin: 0px auto;
            padding: 25px;
            background-color: rgb(193, 224, 251);
            border-radius: 10px;
            box-shadow: 4px 8px 10px rgb(190, 190, 190);
        }
        input
        {
            box-sizing: border-box;
            border: 1px solid rgb(200, 200, 200);
            border-radius: 7px;
            height: 45px;
            padding-left: 10px;
        }
        #i1, #i2
        {
            width: 350px;
        }
        #i1:hover
        {
            background-color: rgb(203, 195, 195);
        }
        #i2:hover
        {
            background-color: rgb(203, 195, 195);
        }
        #i3:hover
        {
            background-color: rgb(195, 3, 3);
        }
        #i4:hover
        {
            background-color: rgb(195, 3, 3);
        }
        #i5:hover
        {
            background-color: rgb(195, 3, 3);
        }
        #i3
        {
            width: 350px;
            height: 40px;
            background-color: rgb(24, 119, 242);
            color: white;
            border: none;
            border-radius: 7px;
        }
        #i4
        {
            color: rgb(24, 119, 242);   
        }
        #i5
        {
            width: 180px;
            height: 40px;
            background-color: rgb(66, 183, 42);
            color: white;
            border: none;
            border-radius: 7px;
        }
    </style>
</head>
<body>
    <h1>facebook</h1>
    <h2>Log in to facebook</h2>
    <form>
        <input type="text" id="i1" placeholder="Email address or phone number">
        <br><br>
        <input type="password" id="i2" placeholder="Password">
        <br><br>
        <button id="i3">Log In</button>
        <br><br>
        <a href="#" id="i4">Forgotten password?</a>
        <hr><br>
        <button id="i5">Create new account</button>
    </form>
</body>
</html>
